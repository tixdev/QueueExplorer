# Topology, users, shovels and policies come from the generated definitions (tools/perf-env/generate_definitions.py).
definitions.import_backend = local_filesystem
definitions.local.path = /etc/rabbitmq/definitions.json
definitions.skip_if_unchanged = true

loopback_users = none

# TLS, as in production: AMQPS on 5671 and management over HTTPS on 15671, with the certificates created by
# tools/perf-env/generate_certs.sh. Clients are not asked for a certificate.
listeners.ssl.default = 5671
ssl_options.cacertfile = /etc/rabbitmq/certs/ca.pem
ssl_options.certfile = /etc/rabbitmq/certs/server.pem
ssl_options.keyfile = /etc/rabbitmq/certs/server.key
ssl_options.verify = verify_none
ssl_options.fail_if_no_peer_cert = false
ssl_options.versions.1 = tlsv1.3
ssl_options.versions.2 = tlsv1.2

management.ssl.port = 15671
management.ssl.cacertfile = /etc/rabbitmq/certs/ca.pem
management.ssl.certfile = /etc/rabbitmq/certs/server.pem
management.ssl.keyfile = /etc/rabbitmq/certs/server.key

# Plain listeners stay open for the local tools (seed script, NServiceBus simulator). The explorer uses TLS only.
listeners.tcp.default = 5672
management.tcp.port = 15672

# Local environment for development and performance tests.
#   tools/perf-env/generate_certs.sh                    # local CA + server certificate for TLS (once)
#   python3 -I tools/perf-env/generate_definitions.py   # (re)generate the RabbitMQ topology
#   docker compose up -d
#   python3 -I tools/perf-env/seed_messages.py          # NServiceBus-shaped sample messages
name: dynaqueueexplorer

services:
  rabbitmq:
    image: rabbitmq:4.1-management
    hostname: rabbit-1
    ports:
      - "5671:5671"     # AMQPS (used by the explorer)
      - "15671:15671"   # management over HTTPS (used by the explorer)
      - "5672:5672"     # AMQP, local tools only
      - "15672:15672"   # management over HTTP, local tools only
    volumes:
      - ./docker/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./docker/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - ./docker/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - ./docker/rabbitmq/certs:/etc/rabbitmq/certs:ro
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 5s
      timeout: 10s
      retries: 30

  # IBM MQ for developers (amd64 only: runs under emulation on Apple silicon). TLS on DEV.APP.SVRCONN with the same
  # local CA as RabbitMQ; the explorer connects as the "app" user.
  ibmmq:
    image: icr.io/ibm-messaging/mq:9.4.4.0-r1
    platform: linux/amd64
    environment:
      LICENSE: accept
      MQ_QMGR_NAME: QM1
      MQ_APP_USER: app
      MQ_APP_PASSWORD: "Dqe_Mq_Dev_2026!"
      MQ_ADMIN_USER: admin
      MQ_ADMIN_PASSWORD: "Dqe_Mq_Admin_2026!"
      MQ_ENABLE_METRICS: "false"
    ports:
      - "1414:1414"
      - "9443:9443"
    volumes:
      - ./docker/ibmmq/20-dqe.mqsc:/etc/mqm/20-dqe.mqsc:ro
      - ./docker/rabbitmq/certs/server.key:/etc/mqm/pki/keys/default/tls.key:ro
      - ./docker/rabbitmq/certs/server.pem:/etc/mqm/pki/keys/default/tls.crt:ro
      - ./docker/rabbitmq/certs/ca.pem:/etc/mqm/pki/keys/default/ca.crt:ro
      - ibmmq-data:/mnt/mqm

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Dqe_Local_Dev_2026!"
      MSSQL_PID: Developer
    ports:
      - "14333:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql

volumes:
  ibmmq-data:
  rabbitmq-data:
  sqlserver-data:
